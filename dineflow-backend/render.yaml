# Render Blueprint - deploys the API (Express + Socket.IO needs a long-running server)
services:
  - type: web
    name: dineflow-api
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false          # deploys are triggered by the GitHub Action after CI passes
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB_NAME
        value: dineflow
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://dineflow-two-chi.vercel.app
      - key: FRONTEND_URL
        value: https://dineflow-two-chi.vercel.app
      - key: CLOUDINARY_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
